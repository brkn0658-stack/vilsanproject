<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifre Değiştir · Vilsan</title>
<style>
  :root{ --bg:#F2F4F3; --surface:#FFFFFF; --ink:#152026; --ink-muted:#5C6B72; --line:#DCE2E1; --accent:#0E7A82; --ok:#2C7A4B; --danger:#B03A2E; }
  body{ background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,sans-serif; margin:0; padding:20px; }
  .container{ max-width:800px; margin:0 auto; }
  .header{ display:flex; justify-content:space-between; align-items:center; background:#152026; color:#fff; padding:15px 20px; border-radius:4px; margin-bottom:20px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:20px; margin-bottom:20px; }
  h2{ margin-top:0; font-size:16px; color:var(--accent); }
  .btn{ background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:4px; font-weight:700; cursor:pointer; }
  .btn:hover{ background:#0A5B62; }
  .btn-logout { background: var(--danger); color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; }
  .btn-logout:hover { background: #8E2E24; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-muted); margin-bottom:4px; }
  .field input{ width:100%; padding:8px; border:1px solid #C3CBC9; border-radius:4px; box-sizing:border-box; }
  .banner{ padding:10px; border-radius:4px; font-size:13px; margin-bottom:10px; }
  .banner-success{ background:#E5F3EA; color:var(--ok); }
  .banner-error{ background:#FBEAE7; color:var(--danger); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1 style="font-size:18px; margin:0;">Vilsan Yönetici Kontrol Paneli</h1>
    <div style="display:flex; align-items:center;">
      <span id="user-info" style="margin-right:15px; font-size:13px;"></span>
      <button class="btn-logout" onclick="cikisYap()">Çıkış Yap</button>
    </div>
  </div>

  <!-- ŞİFRE DEĞİŞTİRME SEKSİYONU -->
  <div class="card">
    <h2>Yönetici Şifre Değiştirme</h2>
    <div id="pass-msg"></div>
    <form id="change-pass-form" style="max-width:400px;">
      <div class="field">
        <label>Mevcut (Eski) Şifre</label>
        <input type="password" id="old-password" required>
      </div>
      <div class="field">
        <label>Yeni Şifre</label>
        <input type="password" id="new-password" required minlength="6">
      </div>
      <div class="field">
        <label>Yeni Şifre (Tekrar)</label>
        <input type="password" id="new-password-confirm" required>
      </div>
      <button type="submit" class="btn">Şifreyi Güncelle</button>
    </form>
  </div>
</div>

<script>
  // Oturum Kontrolü
  async function checkAuth(){
    try {
      const res = await fetch('/api/auth/me');
      const data = await res.json();
      if(!data.authenticated){
        window.location.href = '/login.html';
      } else {
        document.getElementById('user-info').textContent = 'Hoşgeldin, ' + (data.user.fullName || data.user.username);
      }
    } catch (err) {
      window.location.href = '/login.html';
    }
  }

  // Şifre Değiştirme İşlemi
  document.getElementById('change-pass-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const oldPassword = document.getElementById('old-password').value;
    const newPassword = document.getElementById('new-password').value;
    const confirmPass = document.getElementById('new-password-confirm').value;
    const msgDiv = document.getElementById('pass-msg');

    if(newPassword !== confirmPass){
      msgDiv.innerHTML = '<div class="banner banner-error">Yeni şifreler birbiriyle eşleşmiyor!</div>';
      return;
    }

    try {
      const res = await fetch('/api/auth/change-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPassword, newPassword })
      });
      const data = await res.json();

      if(data.success){
        msgDiv.innerHTML = `<div class="banner banner-success">${data.message || 'Şifreniz başarıyla güncellendi.'}</div>`;
        document.getElementById('change-pass-form').reset();
      } else {
        msgDiv.innerHTML = `<div class="banner banner-error">${data.message || 'Şifre değiştirilemedi.'}</div>`;
      }
    } catch(err) {
      msgDiv.innerHTML = '<div class="banner banner-error">Sunucu hatası oluştu.</div>';
    }
  });

  // Sağ Üst Çıkış Yap Butonu
  async function cikisYap() {
    try {
      await fetch('/api/auth/logout', { method: 'POST' });
    } catch (err) {
      console.error('Çıkış hatası:', err);
    } finally {
      window.location.href = 'yonetici.html';
    }
  }

  checkAuth();
</script>

</body>
</html>
